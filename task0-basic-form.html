<main class="container py-5">
  <h1 class="mb-4">Task 0. Simple Contact Form</h1>
  <p>A plain HTML form with no validation attributes. Every field has a <code>&lt;label&gt;</code> linked by <code>for</code>/<code>id</code>.</p>
  <form action="#" method="post" class="plain-form">
    <p>
      <label for="name">Name</label><br>
      <input type="text" id="name" name="name" placeholder="Palenshe">
    </p>
    <p>
      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" placeholder="palenshe@email.com">
    </p>
    <p>
      <label for="message">Message</label><br>
      <textarea id="message" name="message" rows="5" cols="40"></textarea>
    </p>
    <button type="submit">Submit</button>
  </form>
</main>
