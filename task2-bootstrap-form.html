<main class="container py-5">
  <h1 class="mb-4">Task 2. Bootstrap Form Styling</h1>
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <form action="#" method="post" class="card card-body shadow-sm">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Palensheev Palenshe" aria-describedby="nameHelp">
            <div id="nameHelp" class="form-text">Enter your first and last name.</div>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="palenshe@example.com" aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text">We will never share your email.</div>
          </div>
          <div class="col-12">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Send message</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
